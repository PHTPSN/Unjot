<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-lang="zh" data-size="normal" data-shell="app" data-accent="grad" data-screen="conversation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unjot · 主界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Literata:wght@400;500&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.5 3.7 5.5 3.7 9S14.4 18.5 12 21c-2.4-2.5-3.7-5.5-3.7-9S9.6 5.5 12 3Z"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="6" r="2.6"/><path d="M8.6 18h3.4a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M4 7h8M16 7h4M4 12h4M12 12h8M4 17h10M18 17h2"/><path d="M14 5.2v3.6M10 10.2v3.6M16 15.2v3.6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 6a2.5 2.5 0 0 1 2.5-2.5H20V17H6.5A2.5 2.5 0 0 0 4 19.5V6Z"/><path d="M20 17v3.5H6.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M4.6 7.5l2 1.2M17.4 15.3l2 1.2M4.6 16.5l2-1.2M17.4 8.7l2-1.2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L21 21"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24"><path d="M16.8 7.6l-7.3 7.3a2.6 2.6 0 0 0 3.7 3.7l7.2-7.2a4.6 4.6 0 0 0-6.5-6.5l-7.4 7.4a6.6 6.6 0 0 0 9.3 9.3l4.4-4.4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3.5c3.2 4.2 5 6.5 5 9.2a5 5 0 0 1-10 0c0-1.7.9-3.2 2.2-4.6"/><path d="M12 13.6c1 1.1 1.5 2 1.5 2.9a1.5 1.5 0 0 1-3 0c0-.9.5-1.8 1.5-2.9Z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 3 5.5 14H11l-.5 7 8-11H13l.5-7Z"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 11h16v9H4z"/><path d="M3 8h18v3H3zM12 8v12"/><path d="M12 8S10.5 4 8.6 4a2.1 2.1 0 0 0 0 4M12 8s1.5-4 3.4-4a2.1 2.1 0 0 1 0 4"/></symbol>
  <symbol id="i-cup" viewBox="0 0 24 24"><path d="M5.5 9h11l-1.2 7.6a2.2 2.2 0 0 1-2.1 1.9H8.8a2.2 2.2 0 0 1-2.1-1.9L5.5 9Z"/><path d="M16.6 10.4h1.5a1.9 1.9 0 0 1 0 3.8h-1.5"/></symbol>
  <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M5 15v-3a7 7 0 0 1 14 0v3"/><path d="M5 15h2.5v4H5zM16.5 15H19v4h-2.5z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4.5 7A2.5 2.5 0 0 1 7 4.5h10A2.5 2.5 0 0 1 19.5 7v6a2.5 2.5 0 0 1-2.5 2.5H9.5L4.5 20V7Z"/></symbol>
  <symbol id="i-rewrite" viewBox="0 0 24 24"><path d="M4 16.5L15 5.5a2.5 2.5 0 0 1 3.5 3.5L7.5 20H4v-3.5Z"/><path d="M13.5 7l3.5 3.5"/></symbol>
  <symbol id="i-scenario" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9A2.5 2.5 0 0 1 17.5 17h-6L6 21v-4A2.5 2.5 0 0 1 4 14.5v-9Z"/><path d="M8.5 8.5h7M8.5 12h4"/></symbol>
  <symbol id="i-listen" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14h2.5v5H4zM17.5 14H20v5h-2.5z"/></symbol>
  <symbol id="i-explain" viewBox="0 0 24 24"><path d="M9.2 17.2h5.6M10.2 20h3.6"/><path d="M12 3.2a6.2 6.2 0 0 1 3.7 11.2c-.6.5-.9 1-1 1.8H9.3c-.1-.8-.4-1.3-1-1.8A6.2 6.2 0 0 1 12 3.2Z"/></symbol>
  <symbol id="i-review" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4v3.5h3.5"/><circle cx="12" cy="12" r="2.5"/></symbol>
</svg>

<div class="frame">

  <canvas class="dotfield" id="dotfield" aria-hidden="true"></canvas>

  <header class="chrome chrome-app">
    <div class="win-dots"><i></i><i></i><i></i></div>
    <div class="chrome-title">unjot</div>
    <div class="chrome-actions">
      <button class="icon-btn" title="搜索"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="icon-btn" title="更多"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <div class="chrome chrome-web">
    <div class="tabstrip">
      <div class="tab">
        <span class="favicon"></span>
        <span class="tab-title">unjot</span>
        <span class="tab-close"><svg class="ic"><use href="#i-close"/></svg></span>
      </div>
      <button class="tab-new"><svg class="ic"><use href="#i-plus"/></svg></button>
      <div class="tabstrip-spacer"></div>
      <div class="win-dots"><i></i><i></i><i></i></div>
    </div>
    <div class="addressbar">
      <div class="url">
        <svg class="ic url-lock"><use href="#i-lock"/></svg>
        <span id="urlText">app.unjot.local</span>
      </div>
      <button class="icon-btn"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </div>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">un</div>
        <div class="brand-name">unjot</div>
      </div>

      <button class="btn-primary" id="newChat">
        <svg class="ic"><use href="#i-plus"/></svg>
        <span data-i18n="newChat">新建对话</span>
      </button>

      <div class="nav-bottom">
        <button class="nav-item" data-go="settings"><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="nav.settings">设置</span></button>
      </div>
    </aside>

    <div class="screens" id="screens">

      <section class="screen" data-screen="conversation">
        <div class="stream" id="stream">
        </div>
      </section>



      <section class="screen" data-screen="settings">
        <header class="screen-head">
          <div class="head-text"><h1 data-i18n="set.title">设置</h1><p class="sub" data-i18n="set.sub">随时可以改，改完立即生效。</p></div>
        </header>

        <div class="card">
          <div class="card-head"><span data-i18n="set.ai">AI 接入</span></div>
          <label class="field-row">
            <span data-i18n="set.provider">模型提供商</span>
            <input class="text-input" id="aiProvider" type="text">
          </label>
          <label class="field-row">
            <span data-i18n="set.model">模型</span>
            <input class="text-input" id="aiModel" type="text">
          </label>
          <label class="field-row">
            <span data-i18n="set.apiKey">API Key</span>
            <input class="text-input" id="aiKey" type="password">
          </label>
          <label class="field-row">
            <span data-i18n="set.baseUrl">Base URL</span>
            <input class="text-input" id="aiBaseUrl" type="url">
          </label>
          <div class="field-row">
            <span data-i18n="set.key">连接状态</span>
            <b class="status-text" id="aiStatus"><i class="dot"></i><span id="aiStatusText">未连接</span></b>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span data-i18n="set.lang">界面语言</span></div>
          <div class="row-flat">
            <div class="seg">
              <button class="seg-btn" data-lang-set="zh">中文</button>
              <button class="seg-btn" data-lang-set="en">English</button>
            </div>
          </div>
        </div>
      </section>

      <div class="composer" id="composer">
        <input id="composerInput" type="text" autocomplete="off" aria-label="Message">
        <button class="btn-send" id="sendBtn"><svg class="ic"><use href="#i-up"/></svg></button>
      </div>

    </div>
  </div>
</div>


<script type="module" src="./src/ui.js"></script>
</body>
</html>
